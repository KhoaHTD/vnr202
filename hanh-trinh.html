<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1a120b"><!-- Đến từ landing: (1) enter-photo = tấm ảnh đang bay, dựng lại đúng chỗ rồi bay nốt vào ô ảnh (game.js flyIn); (2) enter-fade = màn chuyển đã mờ về --room, trang này hiện dần từ --room. Đọc/ghi bọc try/catch. -->
<script>try{var h=document.documentElement,f=sessionStorage.getItem("enter-photo");if(f){sessionStorage.removeItem("enter-photo");window.__ep=JSON.parse(f);h.classList.add("ep")}else if(sessionStorage.getItem("enter-fade")){sessionStorage.removeItem("enter-fade");h.classList.add("enter-fade")}}catch(e){}</script><title>Hành trình — Đường đến tháng Tám</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500..800;1,500..800&family=Lora:ital,wght@0,400..600;1,400..600&display=swap&subset=vietnamese" rel="stylesheet"><link rel="stylesheet" href="src/css/tokens.css"><link rel="stylesheet" href="src/css/base.css"><link rel="stylesheet" href="src/css/components.css"><link rel="stylesheet" href="src/css/play.css"><link rel="stylesheet" href="src/css/acts.css"><link rel="stylesheet" href="src/css/flyer.css"></head><body>
<script>(function(){var d=window.__ep;if(!d)return;var f=document.createElement("figure");f.className="flyer";f.id="flyer";f.setAttribute("aria-hidden","true");f.style.cssText="left:0;top:0;width:"+d.fw+"px";f.innerHTML='<div class="flyer-media"><img src="'+d.src+'" alt="" width="'+d.w+'" height="'+d.h+'" style="object-position:'+d.focus+'"></div><figcaption>'+d.caption+"</figcaption>";document.body.appendChild(f);setTimeout(function(){var e=document.getElementById("flyer");if(e){e.remove();document.documentElement.classList.remove("ep")}},4000);f.style.transform="translate("+(d.cx-d.fw/2)+"px,"+(d.cy-f.offsetHeight/2)+"px) rotate("+d.rot+"deg)"})()</script>
